---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kouke-bot-data-pvc
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: kouke-bot
      type: data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kouke-bot-config-pvc
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      app: kouke-bot
      type: config
