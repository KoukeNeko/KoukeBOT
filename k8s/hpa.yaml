apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kouke-bot
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kouke-bot
  minReplicas: 1
  maxReplicas: 1  # Keep at 1 due to ReadWriteOnce volume constraint
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

# Note: HPA is disabled by default (maxReplicas: 1) because the bot uses
# ReadWriteOnce volumes. To enable scaling, you would need to:
# 1. Use ReadWriteMany volumes (NFS, EFS, etc.)
# 2. Ensure the application supports multiple instances
# 3. Increase maxReplicas appropriately
