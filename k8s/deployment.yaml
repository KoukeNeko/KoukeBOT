apiVersion: apps/v1
kind: Deployment
metadata:
  name: kouke-bot
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate for single replica with persistent volume
  selector:
    matchLabels:
      app: kouke-bot
  template:
    metadata:
      labels:
        app: kouke-bot
    spec:
      serviceAccountName: kouke-bot
      imagePullSecrets:
        - name: ghcr-secret # Ensure this secret exists if your image is private
      initContainers:
      - name: init-configs
        image: ghcr.io/koukeneko/koukebot:main
        command:
        - sh
        - -c
        - |
          # One-time bootstrap for an empty config PVC.
          if [ -z "$(ls -A /mnt/configs 2>/dev/null)" ]; then
            echo "Config PVC is empty, copying defaults from image..."
            cp -a /app/configs/. /mnt/configs/
          fi

          # Incremental sync: add missing top-level config entries only.
          # Do not overwrite existing files in PVC.
          for src in /app/configs/*; do
            [ -e "$src" ] || continue
            name="$(basename "$src")"
            dst="/mnt/configs/$name"
            if [ ! -e "$dst" ]; then
              echo "Adding missing config entry: $name"
              cp -a "$src" "$dst"
            fi
          done

          # Incremental sync for personas: add newly introduced persona folders.
          if [ -d /app/configs/personas ]; then
            mkdir -p /mnt/configs/personas
            for src in /app/configs/personas/*; do
              [ -e "$src" ] || continue
              name="$(basename "$src")"
              dst="/mnt/configs/personas/$name"
              if [ ! -e "$dst" ]; then
                echo "Adding missing persona: $name"
                cp -a "$src" "$dst"
              fi
            done
          fi

          chown -R 1000:1000 /mnt/configs /app/data
        volumeMounts:
        - name: config
          mountPath: /mnt/configs
        - name: data
          mountPath: /app/data
        securityContext:
          runAsUser: 0
      containers:
      - name: kouke-bot
        image: ghcr.io/koukeneko/koukebot:main
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: kouke-bot-config
              key: GIN_MODE
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: kouke-bot-config
              key: TZ

        # Uncomment and configure secrets as needed
        # envFrom:
        # - secretRef:
        #     name: kouke-bot-secret

        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/configs

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kouke-bot-data-pvc
      - name: config
        persistentVolumeClaim:
          claimName: kouke-bot-config-pvc

      restartPolicy: Always

      securityContext:
        fsGroup: 1000
