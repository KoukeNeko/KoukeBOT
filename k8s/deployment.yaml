apiVersion: apps/v1
kind: Deployment
metadata:
  name: kouke-bot
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  replicas: 1
  strategy:
    type: Recreate  # Use Recreate for single replica with persistent volume
  selector:
    matchLabels:
      app: kouke-bot
  template:
    metadata:
      labels:
        app: kouke-bot
    spec:
      serviceAccountName: kouke-bot
      imagePullSecrets:
        - name: ghcr-secret # Ensure this secret exists if your image is private
      initContainers:
      - name: init-configs
        image: ghcr.io/koukeneko/koukebot:main
        command:
        - sh
        - -c
        - |
          # --- Phase 1: Bootstrap empty config PVC ---
          if [ -z "$(ls -A /mnt/configs 2>/dev/null)" ]; then
            echo "Config PVC is empty, copying defaults from image..."
            cp -a /app/configs/. /mnt/configs/
            # Record initial image version
            cp -f /app/.image-version /mnt/configs/.image-version 2>/dev/null || true
          fi

          # --- Phase 2: Add missing top-level config entries ---
          for src in /app/configs/*; do
            [ -e "$src" ] || continue
            name="$(basename "$src")"
            dst="/mnt/configs/$name"
            if [ ! -e "$dst" ]; then
              echo "Adding missing config entry: $name"
              cp -a "$src" "$dst"
            fi
          done

          # --- Phase 3: Determine if image version changed ---
          # Only sync managed persona files when the Docker image has changed.
          # This preserves Web UI edits across same-image restarts,
          # while still applying git-pushed changes on new image deploys.
          IMAGE_VER=""
          PVC_VER=""
          if [ -f /app/.image-version ]; then
            IMAGE_VER=$(cat /app/.image-version)
          fi
          if [ -f /mnt/configs/.image-version ]; then
            PVC_VER=$(cat /mnt/configs/.image-version)
          fi

          SHOULD_SYNC=false
          if [ -z "$IMAGE_VER" ]; then
            echo "No image version marker (legacy build), syncing all managed files"
            SHOULD_SYNC=true
          elif [ "$IMAGE_VER" != "$PVC_VER" ]; then
            echo "Image version changed: ${PVC_VER:-<none>} -> $IMAGE_VER, syncing managed files"
            SHOULD_SYNC=true
          else
            echo "Image version unchanged ($IMAGE_VER), preserving PVC persona files"
          fi

          # --- Phase 4: Persona sync ---
          # Policy:
          # 1) Always add new persona folders.
          # 2) Sync managed files (config.yaml, lore.md, anchors.yaml)
          #    ONLY when image version changed.
          # 3) Always preserve runtime data (user.md, memory/*).
          if [ -d /app/configs/personas ]; then
            mkdir -p /mnt/configs/personas
            for src in /app/configs/personas/*; do
              [ -e "$src" ] || continue
              name="$(basename "$src")"
              dst="/mnt/configs/personas/$name"

              # Always add new personas
              if [ ! -e "$dst" ]; then
                echo "Adding missing persona: $name"
                cp -a "$src" "$dst"
              fi

              # Sync managed files only when image version changed
              if [ "$SHOULD_SYNC" = "true" ] && [ -d "$src" ]; then
                for managed in config.yaml lore.md anchors.yaml; do
                  if [ -f "$src/$managed" ]; then
                    echo "Syncing persona managed file: $name/$managed"
                    cp -f "$src/$managed" "$dst/$managed"
                  fi
                done
              fi
            done
          fi

          # Update PVC version marker
          if [ -n "$IMAGE_VER" ]; then
            echo "$IMAGE_VER" > /mnt/configs/.image-version
          fi

          chown -R 1000:1000 /mnt/configs /app/data
        volumeMounts:
        - name: config
          mountPath: /mnt/configs
        - name: data
          mountPath: /app/data
        securityContext:
          runAsUser: 0
      containers:
      - name: kouke-bot
        image: ghcr.io/koukeneko/koukebot:main
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: GIN_MODE
          valueFrom:
            configMapKeyRef:
              name: kouke-bot-config
              key: GIN_MODE
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: kouke-bot-config
              key: TZ

        # Uncomment and configure secrets as needed
        # envFrom:
        # - secretRef:
        #     name: kouke-bot-secret

        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/configs

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kouke-bot-data-pvc
      - name: config
        persistentVolumeClaim:
          claimName: kouke-bot-config-pvc

      restartPolicy: Always

      securityContext:
        fsGroup: 1000
