apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kouke-bot
  namespace: kouke-bot
  labels:
    app: kouke-bot
spec:
  podSelector:
    matchLabels:
      app: kouke-bot
  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system  # Adjust based on your ingress namespace
    ports:
    - protocol: TCP
      port: 8080

  # Allow traffic from pods in the same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: kouke-bot
    ports:
    - protocol: TCP
      port: 8080

  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # Allow HTTPS to external APIs (Discord, Gemini, etc.)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

  # Allow HTTP (if needed)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 80
